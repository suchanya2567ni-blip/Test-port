
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานของฉัน</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #0056b3; }
        p { font-size: 1.1em; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน 👋</h1>
        <p>นี่คือโปรเจกต์แรกที่สร้างและเผยแพร่ผ่าน GitHub สำเร็จแล้ว!</p>
    </div>
</body>
</html>
